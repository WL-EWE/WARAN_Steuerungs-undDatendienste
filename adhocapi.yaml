components:
  responses:
    Accepted: {description: Die Anfrage wurde technisch erfolgreich verarbeitet}
    BadRequest: {description: Die Anfrage ist ungültig}
    Unauthorized: {description: Die Anfrage ist nicht autorisiert}
    NotFound: {description: Ressource nicht gefunden}
    MethodNotAllowed: {description: Methode nicht erlaubt}
    InternalError: {description: Interner Fehler}
  parameters:

    transactionId:
      name: transactionId
      in: header
      required: true
      schema:
        type: string
        format: uuid
        example: de14872e-71e7-407f-916f-da8dbde05176


    creationDateTime:
      name: creationDateTime
      in: header
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-07-07T06:58:27.384Z

    initialTransactionId:
      name: initialTransactionId
      in: header
      required: false
      schema:
        type: string
        format: uuid

   # controlActor:
  #  name: controlActor
  #    in: header
   #   required: true
    #  schema:
     #   type: string
      #  pattern: '^\d{13}$'
       # example: 9900496000005

  schemas:

    LocationReference:
      type: object
      required:
        - srId
      properties:
        srId:
          type: string
          pattern: '^C[A-Z0-9]{9}[0-9]$'
          example: C1234848431

    AdHocDirection:
      type: string
      enum:
        - FeedIn
        - Consumption

    AdHocReason:
      type: string
      example: Test
      enum:
        - DSO
        - DSO_TSO
        - Contract
        - Test

    PowerInterval:
      type: object
      
      required:
        - activePowerValue
      properties:
        activePowerValue:
          description: Maximale Wirkleistung in kW
          type: number
          format: double
          minimum: 0
          example: 4.200

    ExecutionPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              format: date-time
            executionTimeUntil:
              type: string
              format: date-time
    
    ExecutionInterval:
      allOf:
        - type: object
          required:
            - executionFrom
            - executionUntil
          properties:
            executionFrom:
              type: string
              format: date-time
            executionUntil:
              type: string
              format: date-time

    DurationPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - duration
          properties:
            duration:
              type: integer
              example: 900

    PowerIntervalHHMM:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "15:30:00Z"
            executionTimeUntil:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "18:15:00Z"
    
    AdHocPrioItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          required:
            - adHocReason
            - adHocDirection
            - adHocMaximumValues
          properties:
            adHocReason:
              $ref: '#/components/schemas/AdHocReason'
            adHocDirection:
              $ref: '#/components/schemas/AdHocDirection'
            adHocMaximumValues:
              type: array
              items:
                $ref: '#/components/schemas/ExecutionPowerInterval'

    AdHocPrioRequest:
        $ref: '#/components/schemas/AdHocPrioItem'

    AdHocZyklischItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          required:
            - adHocReason
            - adHocDirection
            - executionRange
            - adHocMaximumValues
          properties:
            adHocReason:
              $ref: '#/components/schemas/AdHocReason'
            adHocDirection:
              $ref: '#/components/schemas/AdHocDirection'
            executionRange:
              $ref: '#/components/schemas/ExecutionInterval'

            adHocMaximumValues:
              type: array
              maxItems: 96
              items:
                $ref: '#/components/schemas/PowerIntervalHHMM'



    AdHocZyklischRequest:
        $ref: '#/components/schemas/AdHocZyklischItem'

    SoftstartRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'   
          - type: object
            properties:
              softstartValuesMaxFeedIn:
                type: array
                items:
                  $ref: '#/components/schemas/DurationPowerInterval'
                example:
                  - activePowerValue: 0
                    duration: 900
                  - activePowerValue: 4.2
                    duration: 3600
              softstartValuesMaxConsumption:
                type: array
                items:
                  $ref: '#/components/schemas/DurationPowerInterval'
                example:
                  - activePowerValue: 2
                    duration: 900
                  - activePowerValue: 4.2
                    duration: 3600

    FailsafeRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            properties:
              failsafeValueFeedIn:
                $ref: '#/components/schemas/DurationPowerInterval'
              failsafeValueConsumption:
                $ref: '#/components/schemas/DurationPowerInterval'

    InitialZustandRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            properties:
        
              adHocStopTime:
                type: string
                format: date-time
              stopProfile:
                type: string
                example: "AdHoc-01"
                enum:
                  - AdHoc-01
                  - AdHoc-02
                  - AdHoc-03


    PreliminaryResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
                - adHocPreliminaryState
                - adHocPreliminaryReason
            properties:
              adHocPreliminaryState:
                type: string
                enum:
                  - possible
                  - unable
                example: possible
              adHocPreliminaryReason:
                type: string
                example: Steuerungseinrichtung erreichbar und Fahrplan plausibel geprüft.


    FinalResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - adHocState
              - adHocReason
            example:
                srId: C1234848431
                adHocState: possible
                adHocReason: Fahrplan erfolgreich in der Steuerungseinrichtung aktiviet.
            properties:
              adHocState:
                type: string
                enum:
                  - possible
                  - unable
              adHocReason:
                type: string

    InformationRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object     
            required:
              - srId
              - partnerId
            properties:
              partnerId:
                type: string
                example: 9900496000005
            # adHocEndDate:
            #   type: string
            #   format: date-time
              adHocPrioValues:
                type: array
                items:
                  $ref: '#/components/schemas/AdHocPrioItem'

              adHocZyklisch:
                type: array
                items:
                  $ref: '#/components/schemas/AdHocZyklischItem'
              adHocSoftstart:
                type: array
                items:
                  $ref: '#/components/schemas/SoftstartRequest'
              adHocFailsafe:
                type: array
                items:
                  $ref: '#/components/schemas/FailsafeRequest'
              initialZustand:
                type: array
                items:
                  $ref: '#/components/schemas/InitialZustandRequest'
