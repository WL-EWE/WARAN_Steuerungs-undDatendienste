openapi: 3.0.3

info:
  title: WARAN - Impuls zur Anpassung der Ad-Hoc-Steuerungs-API
  version: 0.9.1
  description: >
    Aufbauend auf dem bereits existierenden API-Webdienst zur prozessualen Abwicklung von Steuerungshandlungen (https://edi-energy.github.io/api-electricity/aktuell-gueltig/#/), werden im vorliegenden Abschnitt Erweiterungen vorgeschlagen, die es den Marktakteuren ermöglichen das volle Potential der Ad-hoc Steuerung zu nutzen. 
    

    Zur eindeutigen fachlichen Zuordnung der Steuerungsdienste, soll zunächst präzisiert werden, dass die lokale Weitergabe der Ad-hoc Steuerungshandlungen verbrauchsseitig stets über den EEBUS UseCase LPC und einspeiseseitig stets über den EEBUS UseCase LPP erfolgt.* Neben dem kurativen Ad-hoc Eingriff des Netzbetreiber (bspw. nach $14a EnWG) ist es vorgesehen die Steuerungssignale auch im Kontext weiterer netzstabilisierender Maßnahmen zu verwenden. Dazu zählen u.a. Fallbackszenarien, um im Falle von Kommunikationsstörungen oder bei Spannungswiederkehr ein definiertes Verhalten der steuerbaren Anlagen zu gewährleisten. Damit die unterschiedlichen Szenarien konfliktfrei eingesetzt werden können, sind Definitionen und Prioritäten bei der Umsetzung zu berücksichtigen. Die Berücksichtigung der Prioritäten und die Weitergabe der Steuerungshandlungen an die Steuerungseinrichtung bzw. an die steuerbare Einrichtung orientiert sich dabei u.a. an dem VDE FNN Hinweis „Steuerungs-Administration“. Insbesondere das Konzept des Residualprofils wird aufgegriffen und als geeignete Möglichkeit identifiziert, die unterschiedlichen Signale im Backend des Messstellenbetreibers zu harmonisieren. Im aktuellen Abschnitt meint das Ad-hoc Residualprofil dabei die jeweiligen LPC und LPP Werte, die als auszuführendes Array an Werten auf die Steuerungseinrichtung übertragen werden. Die Werte können dabei einen zeitlichen Horizont von mehreren Stunden oder Tagen abdecken. Jeder neue Aufruf sorgt für eine Aktualisierung des Residualprofils.


    Ingesamt ergeben sich die folgenden API Dienste die mit der entsprechenden Berechtigung beim MSB bestellt und genutzt werden können:
      - AdHoc-01 "Priorisierte Ad-hoc Steuerungen" wird ins Residualprofil übernommen und überschreibt zyklische bzw. ältere AdHoc Steuerungshandlungen
      - AdHoc-02 "Zyklische AdHoc Steuerung" wird ins Residualprofil übernommen und täglich wiederkehrend ausgeführt. Kann durch neuere AdHoc Anweisungen übersteuert werden. 
      - AdHoc-03 "Softstart" Wird unabhängig vom Residualprofil aktiviert, sobald es einen unerwarteten Neustart der Steuerungseinrictung gibt (Spannungswiederkehr). Wird mit höchster Priorität ausgeführt und übersteuert somit das Ad-hoc Residualprofil.
      - AdHoc-04 "Failsafe-Konfiguration" Konfiguration der Failsafe Werte gemäß EEBUS LPC / LPP Szenario 2
      - AdHoc-05 "Löschen vorhandener Ad-hoc Steuerungen" setzt die Anweisungen des jeweiligen Absenders auf den ursprünglichen Zustand (i.d.R. unbegrenzt bzw. 100%) zurück. Optional kann das entsprechende Profil zum Zurücksetzen angegeben werden.



    *Fokus liegt auf der digitalen Schnittstelle. Insbesondere im Falle von Steuerungsdiensten wird angenommen, dass die „Relaissteuerung“ eine Übergangslösung darstellt. Die fachliche Ausprägung der Prozesse und API-Dienste sollte daher stets mit Fokus auf die digitale Steuerung gemäß der VDE-2829-6-1 erfolgen. Eine Abwärtskompatibilität zum Relais kann in der Regel gewährleistet werden, ist aber nicht Fokus der vorliegenden Spezifikation. 

servers:
  - url: https://api.example.de

tags:
  - name: Anweisung AdHoc Steuerungshandlung
  - name: Antwort AdHoc Steuerungshandlung
  - name: Mitteilung AdHoc Steuerungshandlung an Berechtigte

paths:

  /to/MSB/adHoc/command/adhocPrio/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-01 -> Priorisierte Ad-hoc-Steuerung
      description: >
        Aufbauend auf dem bestehenden API-Webdienst zur Steuerung, werden inhaltliche Anpassungen bzw. Erweiterungen vorgeschlagen. Zu den Anpassungen zählen bspw. die Berücksichtigung der Energierichtung. Die Werte werden je Energierichtung in das jeweilige Ad-hoc Residualprofil übernommen und mit hoher Priorität umgesetzt. Die Ad-hoc Residualprofile (LPC-RP / LPP-RP) können im Backend des MSB gebildet unnd an die Steuerungseinrichtung weitergericht werden. Sie entsprechen dabei den Steuerungsanwendungsfällen 1 und 2 gemäß Implementierungshinweis des BSI (SAF1 / SAF2).
        

        **Mögliche energiewirtschaftliche Szenarien:**
          -	VNB - §14a EnWG „Notfallsignal" -> LPC RP  
          -	VNB - §9 EEG „Notfallsignal“ -> LPP RP
          -	VNB - Redispatch (2.0/3.0) -> LPP RP*
          -	LF – Direktvermarktung u.a. § §10b EEG – LPP RP**

        *Für Redispatch wird (bei Verfügbarkeit) der Hüllkurven Anwendungsfall empfohlen. Durch die Prognosebasis sind Eingriffe in der Regel mit ausreichend Vorlauf bekannt, sodass eine lokale Optimierung auf dem Energiemanagement erreicht werden kann.


        **„Marktliche Steuerung“ durch bspw. Direktvermarkter ist grundsätzlich auch mit Ad-hoc Steuerungssignalen umsetzbar. Es gilt zu beachten, dass der technische Use Case (LPC/LPP) nicht für die marktliche Anwendung bestimmt ist. Missverständnisse bei der Umsetzung, aufgrund der Darstellung als Netzengpasssignal auf der Kundenseite sind zu erwarten. Für die marktlichen Steuerung wird daher der Flexband bzw. Hüllkurven Anwendungsfall empfohlen.

      operationId: postAdHocPrio
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocPrioRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/command/adhocCyclic/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-02 -> Zyklische AdHoc Steuerung 
      description: >
        Erweiterung auf einen zweiten Ad-hoc Steuerungsservice der eine zyklische (täglich wiederkehrender) Ausführung ermöglicht. Erhält eine niedrigere Priorität und ist somit durch AdHoc-01 übersteuerbar. Wird ebenfalls ins jeweilige Ad-hoc Residualprofil übernommen. Entspricht fachlich weitestgehend den heutigen langfristigen Steuerungshandlungen (bspw. Leistungskurvendefinition) und kann diese Anwendungsfälle ggf. zukünftig ersetzen.
        

        **Mögliche energiewirtschaftliche Szenarien:**
          -	VNB - §14a EnWG „präventiv” (Bis Ende 2028) -> LPC RP
          -	VNB – Backup-Fahrplan für Kommunikationsstörung -> LPC/LPP RP
          -	LF – Backup-Fahrplan für Kommunikationsstörung -> LPC/LPP RP**

         **„Marktliche Steuerung“ durch bspw. Direktvermarkter ist grundsätzlich auch mit Ad-hoc Steuerungssignalen umsetzbar. Es gilt zu beachten, dass der technische Use Case (LPC/LPP) nicht für die marktliche Anwendung bestimmt ist. Missverständnisse bei der Umsetzung, aufgrund der Darstellung als Netzengpasssignal auf der Kundenseite sind zu erwarten. Für die marktlichen Steuerung wird daher der Flexband bzw. Hüllkurven Anwendungsfall empfohlen.

      operationId: postAdHocZyklisch
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocZyklischRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/parameter/softstart/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-03 -> Softstartprofil
      description: >
        Ein Ad-hoc Profil (LPC/LPP SSt) welches dediziert auf der Steuerungseinrichtung hinterlegt wird und nur bei einer lokalen Spannungsunterbrechung aktiviert wird. Wird mit höchster Priorität ausgeführt und übersteuert somit das Ad-hoc Residualprofil (LPC RP / LPP RP). Sofern die Verbindung zum Backend wieder hergestellt ist, kann ein aktiviertes Softstartprofil über den API Dienst "AdHoc-05" zurückgesetzt werden. Die Softstart Profile (LPC SSt / LPP SSt) entsprechen den Steuerungsanwendungsfällen 5 und 6 gemäß Implementierungshinweis des BSI (SAF5 / SAF6).
        

        **Mögliche energiewirtschaftliche Szenarien:**
          - VNB - Netzstabilität nach Spannungswiederkehr -> LPC/LPP SSt

        **Einschränkung:** Nur durch den VNB zulässig
        
      operationId: postSoftstart
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftstartRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/parameter/failsafe/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-04 -> Failsafe-Konfiguration
      description: >
        Konfiguration des Failsafe Werte gemäß EEBUS LPC / LPP Szenario 2. Wird über die Infrastruktur bis zur steuerbaren Anlage durchgereicht und dort bei lokalem Kommunikationsausfall aktiviert.
        Die Failsafe Werte (LPC FS / LPP FS) entsprechen den Steuerungsanwendungsfällen 3 und 4 gemäß Implementierungshinweis des BSI (SAF3 / SAF4).

        
        **Mögliche energiewirtscgaftliche Szenarien:**
          - VNB – Definiertes Verhalten bei temporären lokalen Kommunikationsstörung 
          
        **Einschränkung:** Nur durch den VNB zulässig


      operationId: postFailsafe
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailsafeRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/reset/v0:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-05 -> Reset vorhandener Ad-hoc-Steuerungen
      description: >
        Erlaubt die Deaktivierung oder das Zurücksetzen von zuvor übermittelten AdHoc Steuerungsprofilen. Es werden alle betroffenen Einträge des Absenders, die nach dem gewünschten Änderungszeitpunkt liegen, im jeweiligen AdHoc Profil adressiert (also gelöscht oder zurückgesetzt)  
      operationId: postInitialZustand
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
      #  - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialZustandRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /from/MSB/adHoc/preliminaryResponse/v0:
    post:
      tags: [Antwort AdHoc Steuerungshandlung]
      summary: AdHoc-06 -> Vorläufige Antwort
      description: >
       Anpassung und Erweiterung der vorläufigen Rückmeldung. Unter anderem wurden zusätzliche ResponseCodes eingeführt, um eine möglichst präzise Rückmeldung an den auslösenden Akteur zu übermitteln.

       Die vorläufige Antwort wird unmittelbar nach fachlicher Prüfung der Steuerungsanweisung versendet, unabhängig davon, ob die Steuerungseinrichtug den Befehl tatsächlich umsetzen kann.
      operationId: postPreliminaryResponse
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
        - $ref: '#/components/parameters/referenceId'

       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreliminaryResponse'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /from/MSB/adHoc/finalResponse/v0:
    post:
      tags: [Antwort AdHoc Steuerungshandlung]
      summary: AdHoc-07 -> Finale Antwort
      description: >
       Anpassung und Erweiterung der finalen Rückmeldung. Unter anderem wurden zusätzliche ResponseCodes eingeführt, um eine möglichst präzise Rückmeldung an den auslösenden Akteur zu übermitteln.

       Die finale Antwort wird unmittelbar nach erfolgreicher Konfiguration der Steuerungsanweisung versendet, d.h. sobald die Steuerungseinrichtug den Befehl erfolgreich entgegengenommen hat.


       **Hinweis:** Ob die steuerbare Einrichtung auf Kundenseite den Steuerbefehl zum Ausführungszeitpunkt verarbeiten kann und erfolgreich umsetzt, ist mit dieser Antwort nicht sichergestellt.
      operationId: postFinalResponse
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
        - $ref: '#/components/parameters/referenceId'
       # - $ref: '#/components/parameters/controlActor'      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalResponse'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /from/MSB/adHoc/information/v0:
    post:
      tags: [Mitteilung AdHoc Steuerungshandlung an Berechtigte]
      summary: AdHoc-08 -> Information über aktive Ad-hoc-Steuerungen
      description: >
       Alle erfolgreich verarbeiteten Steuerungshandlungen werden unmittelbar nach der positiven finalen Antwort auch an alle berechtigten Marktpartner übermittelt, sodass eine Transparenz über sämtliche Steuerungsanweisungen besteht. Dabei werden nur die angefragten Steuerungshandlungen transparent gemacht. Die daraus abgeleiteten Residualprofile können über eine seperarte Status API abgefragt werden, sofern seitens des Absenders daran Bedarf besteht.


       **Besonderheit:** Zusätzlich werden aktivie Softstartsequenzen übermittelt, sobald diese nach Wiederherstellung der Kommunikation vom MSB erkannt werden. Dadurch kann der VNB die laufenden Softstartsequenz bei Bedarf beenden.
      operationId: postInformation
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

components:
  responses:
    Accepted: {description: Die Anfrage wurde technisch erfolgreich verarbeitet}
    BadRequest: {description: Die Anfrage ist ungültig}
    Unauthorized: {description: Die Anfrage ist nicht autorisiert}
    NotFound: {description: Ressource nicht gefunden}
    MethodNotAllowed: {description: Methode nicht erlaubt}
    InternalError: {description: Interner Fehler}
  parameters:

    transactionId:
      name: transactionId
      in: header
      description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs des sendenden Marktpartners.
      required: true
      schema:
        type: string
        format: uuid
        example: de14872e-71e7-407f-916f-da8dbde05176
 
    referenceId:
      name: referenceId
      in: header
      description: Externe Vorgangsreferenz zur eindeutigen Identifikation des ursprünglichen Befehls (transactionId aus vorlegleagerten Request "Anweisung AdHoc Steuerungshandlung").
      required: true
      schema:
        type: string
        format: uuid
        example: de14872e-71e7-407f-916f-da8dbde05177

    creationDateTime:
      name: creationDateTime
      in: header
      description: Zeitpunkt an dem der Aufruf erstellt wurde
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-07-07T06:58:27.384Z

    initialTransactionId:
      name: initialTransactionId
      in: header
      description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
      required: false
      schema:
        type: string
        format: uuid

   # controlActor:
  #  name: controlActor
  #    in: header
   #   required: true
    #  schema:
     #   type: string
      #  pattern: '^\d{13}$'
       # example: 9900496000005

  schemas:

    LocationReference:
      type: object
      required:
        - locationId
      properties:
        locationId:
          type: string
          description: Die ID wird durch den BDEW festgelegt. In der vorliegenden Spezifikation wird angenommen, dasss zukünftig ausschließlich über die SR-ID gesteuert wird.
          pattern: '^C[A-Z0-9]{9}[0-9]$'
          example: C1234848431

    AdHocDirection:
      type: string
      enum:
        - Production
        - Consumption

    AdHocReason:
      type: string
      example: Test
      description: >
       Die Angabe eines AdHocReason sorgt für eine Transparenz und kann u.a. für Dokumentationen und Veröffentlichungspflichten genutzt werden. Neben gesezlich vorschegeschriebenen Gründen (bspw. §14a EnWG) kann es eine vertragliche Basis geben (bspw. bei marktlichen Akteuren). Außerdem kann "Test" als Grund angegeben werden und explizit für Teststeuerungen eingesetzt werden.
      enum:
        - Legal/Regulatory
        - Contract
        - Test

    PowerInterval:
      type: object
      
      required:
        - activePowerValue
      properties:
        activePowerValue:
          description: Maximale Wirkleistung in kW
          type: number
          format: double
          minimum: 0
          example: 4.200

    ExecutionPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              format: date-time
            executionTimeUntil:
              type: string
              format: date-time
    
    ExecutionInterval:
      allOf:
        - type: object
          required:
            - executionFrom
            - executionUntil
          properties:
            executionFrom:
              type: string
              format: date-time
            executionUntil:
              type: string
              format: date-time

    DurationPowerInterval:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - duration
          properties:
            duration:
              type: integer
              example: 900

    PowerIntervalHHMM:
      allOf:
        - $ref: '#/components/schemas/PowerInterval'
        - type: object
          required:
            - executionTimeFrom
            - executionTimeUntil
          properties:
            executionTimeFrom:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "15:30:00Z"
            executionTimeUntil:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'

              example: "18:15:00Z"
    
    AdHocPrioItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          required:
            - adHocReason
            - adHocDirection
            - adHocMaximumValues
          properties:
            adHocReason:
              $ref: '#/components/schemas/AdHocReason'
            adHocDirection:
              $ref: '#/components/schemas/AdHocDirection'
            adHocMaximumValues:
              type: array
              items:
                $ref: '#/components/schemas/ExecutionPowerInterval'

    AdHocPrioRequest:
        $ref: '#/components/schemas/AdHocPrioItem'

    AdHocZyklischItem:
      allOf:
        - $ref: '#/components/schemas/LocationReference'
        - type: object
          required:
            - adHocReason
            - adHocDirection
            - executionRange
            - adHocMaximumValues
          properties:
            adHocReason:
              $ref: '#/components/schemas/AdHocReason'
            adHocDirection:
              $ref: '#/components/schemas/AdHocDirection'
            executionRange:
              $ref: '#/components/schemas/ExecutionInterval'

            adHocMaximumValues:
              type: array
              maxItems: 96
              items:
                $ref: '#/components/schemas/PowerIntervalHHMM'



    AdHocZyklischRequest:
        $ref: '#/components/schemas/AdHocZyklischItem'

    SoftstartRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'   
          - type: object
            properties:
              softstartValuesMaxProduction:
                type: array
                items:
                  $ref: '#/components/schemas/DurationPowerInterval'
                example:
                  - activePowerValue: 0
                    duration: 900
                  - activePowerValue: 4.2
                    duration: 3600
              softstartValuesMaxConsumption:
                type: array
                items:
                  $ref: '#/components/schemas/DurationPowerInterval'
                example:
                  - activePowerValue: 2
                    duration: 900
                  - activePowerValue: 4.2
                    duration: 3600

    FailsafeRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            properties:
              failsafeValueProduction:
                $ref: '#/components/schemas/DurationPowerInterval'
              failsafeValueConsumption:
                $ref: '#/components/schemas/DurationPowerInterval'

    InitialZustandRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            properties:
        
              adHocStopTime:
                type: string
                format: date-time
              stopProfile:
                type: string
                example: "AdHoc-01"
                enum:
                  - AdHoc-01
                  - AdHoc-02
                  - AdHoc-03


    PreliminaryResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - preliminaryState
              - preliminaryResponseCode
            properties:
              preliminaryState:
                type: string
                enum: [possible, unable]
                example: "unable"
              preliminaryResponseCode:
                type: string
                enum: [succeeded, communicationFailure, overload, maintanance, missing contract, invalid message, unable]
                description: >
                  succeeded = erfolgreiche Verarbeitung; 
                  communicationFailure = temporäre Störung in der Gerätekommunikation; 
                  localFailure = Gerät(e) Störung - wird durch Außendienst behoben;
                  customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (bspw. SHIP Pairing);
                  overload = Überlastung der Kommunikationsstrecke;
                  missing contract = Keine gültige Berechtigung;
                  invalid message = Nachricht enthält fachliche Fehler;
                  unable = Sonstiger Fehler, siehe weitere Fehlerbeschreibung.
                example: "customerInteractionRequired"
              preliminaryReason:
                type: string
                example: "Fehlendes Pairing zwischen der Steuerungseinrichtung und der steuerbaren Einrichtung des Betreibers. Eine Kundeninteraktion ist notwendig"


    FinalResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - adHocState
              - adHocReason
            example:
                locationId: C1234848431
                adHocState: possible
                adHocReason: Fahrplan erfolgreich in der Steuerungseinrichtung aktiviet.
            properties:
              adHocState:
                type: string
                enum:
                  - possible
                  - unable
              adHocReason:
                type: string

    InformationRequest:
      allOf:
          #- $ref: '#/components/schemas/LocationReference'  
          - type: object     
            required:
              - partnerId
            properties:
              partnerId:
                type: string
                example: 9900496000005
            # adHocEndDate:
            #   type: string
            #   format: date-time
              adHocPrioValues:
                type: array
                items:
                  $ref: '#/components/schemas/AdHocPrioItem'

              adHocZyklisch:
                type: array
                items:
                  $ref: '#/components/schemas/AdHocZyklischItem'
              
              adHocSoftstart:
                type: array
                items:
                  allOf:
                    - type: object
                      properties:
                        softstartActive:
                          type: boolean
                          description: Wenn eine aktive SoftstartSequenz erkannt wird, wird der Wert auf "True" gesetztz; Andernfalls wird standardmäßig "false" gesendet
                      required:
                        - softstartActive
                    - $ref: '#/components/schemas/SoftstartRequest'

              adHocFailsafe:
                type: array
                items:
                  $ref: '#/components/schemas/FailsafeRequest'
              initialZustand:
                type: array
                items:
                  $ref: '#/components/schemas/InitialZustandRequest'
