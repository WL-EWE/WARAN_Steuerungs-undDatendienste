openapi: 3.0.3

info:
  title: WARAN - Impuls zur Anpassung der Ad-Hoc-Steuerungs-API
  version: 0.9.0
  description: >
    Aufbauend auf dem bereits existierenden API-Webdienst zur prozessualen Abwicklung von Steuerungshandlungen (https://edi-energy.github.io/api-electricity/aktuell-gueltig/#/), werden im vorliegenden Abschnitt Erweiterungen vorgeschlagen, die es den Marktakteuren ermöglichen das volle Potential der Ad-hoc Steuerung zu nutzen. Zur eindeutigen fachlichen Zuordnung der Steuerungsdienste, soll zunächst präzisiert werden, dass die lokale Weitergabe der Ad-hoc Steuerungshandlungen verbrauchsseitig stets über den EEBUS UseCase LPC und einspeiseseitig stets über den EEBUS UseCase LPP erfolgt.* Neben dem kurativen Ad-hoc Eingriff des Netzbetreiber (bspw. nach $14a EnW) ist es vorgesehen die Anwendungsfälle auch im Kontext weiterer netzstabilisierender Maßnahmen zu verwenden. Dazu zählen u.a. Fallbackszenarien, um im Falle von Kommunikationsstörungen oder bei Spannungswiederkehr ein definiertes Verhalten der steuerbaren Anlagen zu gewährleisten. Damit die unterschiedlichen Szenarien konfliktfrei eingesetzt werden können, sind entsprechende Prioritäten bei der Umsetzung zu berücksichtigen. Die Berücksichtigung der Prioritäten und die Weitergabe der Steuerungshandlungen an die Steuerungseinrichtung bzw. an die steuerbare Einrichtung orientiert sich dabei u.a. an dem FNN Hinweis „Steuerungs-Administration“. Insbesondere das Konzept des Residualprofils wird aufgegriffen und als geeignete Möglichkeit identifiziert, die unterschiedlichen Signale im Backend des Messstellenbetreibers zu harmonisieren. Im aktuellen Abschnitt meint das Ad-hoc Residualprofil dabei die jeweiligen LPC und LPP Werte, die als auszuführendes Array an Werten auf die Steuerungseinrichtung übertragen werden. Die Werte können dabei einen zeitlichen Horizont von mehreren Stunden oder Tagen abdecken. Jeder neue Aufruf sorgt für eine Aktualisierung des Residualprofils.


    Ingesamt ergeben sich die folgenden API Dienste die mit der entsprechenden Berechtigung beim MSB bestellt und genutzt werden können:
      - AdHoc-01 "Priorisierte Ad-hoc Steuerungen" wird ins Residualprofil übernommen und überschreibt zyklische bzw. ältere AdHoc Steuerungshandlungen
      - AdHoc-02 "Zyklische AdHoc Steuerung" wird ins Residualprofil übernommen und täglich wiederkehrend ausgeführt. Kann durch neuere AdHoc Anweisungen übersteuert werden. 
      - AdHoc-03 "Softstart" Wird unabhängig vom Residualprofil aktiviert, sobald es einen unerwarteten Neustart der Steuerungseinrictung gibt (Spannungswiederkehr). Wird mit höchster Priorität ausgeführt und übersteuert somit das Ad-hoc Residualprofil.
      - AdHoc-04 "Failsafe-Konfiguration" Konfiguration der Failsafe Werte gemäß EEBUS LPC / LPP Szenario 2
      - AdHoc-05 "Löschen vorhandener Ad-hoc Steuerungen" setzt die Anweisungen des jeweiligen Absenders auf den ursprünglichen Zustand (i.d.R. unbegrenzt bzw. 100%) zurück. Optional kann das entsprechende Profil zum Zurücksetzen angegeben werden.



    *Fokus liegt auf der digitalen Schnittstelle. Insbesondere im Falle von Steuerungsdiensten wird angenommen, dass die „Relaissteuerung“ lediglich als Übergangslösung zu sehen ist. Die fachliche Ausprägung der Prozesse und API-Dienste sollte daher stets mit dem Fokus auf die digitale EEBUS Steuerung erfolgen. Eine Abwärtskompatibilität zum Relais kann in der Regel gewährleistet werden, ist aber nicht Fokus im vorliegenden Dokument. 

servers:
  - url: https://api.example.de

tags:
  - name: Anweisung AdHoc Steuerungshandlung
  - name: Antwort AdHoc Steuerungshandlung
  - name: Mitteilung AdHoc Steuerungshandlung an Berechtigte

paths:

  /to/MSB/adHoc/command/adhocPrio:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-01 Priorisierte Ad-hoc-Steuerung
      description: >
        Aufbauend auf dem bestehenden API-Webdienst zur Steuerung, wird die Schnittstelle mit minimalen inhaltlichen Anpassungen vorgeschlagen. Zu den Anpassungen zählen bspw. die Berücksichtigung der Energierichtung. Die Werte werden je Energierichtung in das jeweilige Ad-hoc Residualprofil übernommen und mit hoher Priorität umgesetzt. Die Ad-hoc Residualprofile (LPC-RP / LPP-RP) entsprechen dabei den Steuerungsanwendungsfällen 1 und 2 gemäß Implementierungshinweis des BSI (SAF1 / SAF2).
        

        Mögliche Szenarien:
          -	VNB - §14a EnWG „Notfallsignal -> LPC RP  
          -	VNB - §9 EEG „Notfallsignal“ -> LPP RP
          -	VNB - Redispatch (2.0/3.0) -> LPP RP*
          -	LF – Direktvermarktung u.a. § §10b EEG – LPP RP**

      operationId: postAdHocPrio
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocPrioRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/command/adhocCyclic:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-02 Zyklische AdHoc Steuerung 
      description: >
        Erweiterung auf Array mit zyklischer (täglich wiederkehrender) Ad-hoc Ausführung. Erhält niedrigere Priorität und ist somit durch AdHoc-01 übersteuerbar. Wird ebenfalls ins jeweilige Ad-hoc Residualprofil übernommen. Entspricht weitestgehend den heutigen langfristigen Steuerungshandlungen (Leistungskurvendefinition).
        

        Mögliche Szenarien:
          -	VNB - §14a EnWG „präventiv” (Bis Ende 2028) -> LPC RP
          -	VNB – Backup-Fahrplan für Kommunikationsstörung -> LPC/LPP RP
          -	LF – Backup-Fahrplan für Kommunikationsstörung -> LPC/LPP RP**

      operationId: postAdHocZyklisch
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdHocZyklischRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/parameter/softstart:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-03 Softstartprofil
      description: >
        Ein Ad-hoc Profil (LPC/LPP ST) welches dediziert auf der Steuerungseinrichtung hinterlegt wird und nur bei einer lokalen Spannungsunterbrechung aktiviert wird. Wird mit höchster Priorität ausgeführt und übersteuert somit das Ad-hoc Residualprofil.
        Die Softstart Profile (LPC SST / LPP SST) entsprechen den Steuerungsanwendungsfällen 5 und 6 gemäß Implementierungshinweis des BSI (SAF5 / SAF6).
        
        Mögliche Szenarien:
          - VNB - Netzstabilität nach Spannungswiederkehr -> LPC/LPP SST

        
      operationId: postSoftstart
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoftstartRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/parameter/failsafe:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-04 Failsafe-Konfiguration
      description: >
        Konfiguration des Failsafe Werte gemäß EEBUS LPC / LPP Szenario 2. Nur durch den VNB zulässig. Wird über die Infrastruktur bis zur steuerbaren Anlage durchgereicht und dort bei lokalem Kommunikationsausfall aktiviert.
        Die Failsafe Werte (LPC FS / LPP FS) entsprechen den Steuerungsanwendungsfällen 3 und 4 gemäß Implementierungshinweis des BSI (SAF3 / SAF4).

        
        Mögliche Szenarien:
          - VNB – Definiertes Verhalten bei temporären lokalen Kommunikationsstörung 


      operationId: postFailsafe
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailsafeRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/MSB/adHoc/reset:
    post:
      tags: [Anweisung AdHoc Steuerungshandlung]
      summary: AdHoc-05 Löschen vorhandener Ad-hoc-Steuerungen
      description: >
        Erlaubt die Deaktivierung von zuvor übermittelten Steuerungshandlungen. Die gesamten Einträge des Absenders werden im AdHoc Residualprofil gelöscht.  
      operationId: postInitialZustand
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
      #  - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialZustandRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /from/MSB/adHoc/preliminaryResponse:
    post:
      tags: [Antwort AdHoc Steuerungshandlung]
      summary: AdHoc-06 Vorläufige Antwort
      operationId: postPreliminaryResponse
      parameters:
        - $ref: '#/components/parameters/transactionId'
