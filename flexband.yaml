openapi: 3.0.3
info:
  title: WARAN - Impuls zur Erstellung einer Flexband API
  version: 0.8.2
  description: >
    Aufbauend auf dem bereits existierenden API-Webdienst zur prozessualen Abwicklung von Steuerungshandlungen (https://edi-energy.github.io/api-electricity/aktuell-gueltig/#/) und den vorgeschlagenen Erweiterungen zur AdHoc API, werden im vorliegenden Abschnitt neue API Dienste vorgeschlagen. Die Flexband-API bietet erweiterte Möglichkeiten Steurungshandlungen über die MSB-Infrastruktur umzusetzen. Basis hierfür ist der EEBUS Anwendungsfall Power Envelope (POEN), welcher auch unter dem Begriff Hüllkurve oder Flexband bekannt ist. In Abgrenzung zur kurativen Ad-hoc Steuerung, bietet die Hüllkurve dabei die Chance eine proaktive Wirkung, sowie eine bessere Verzahnung von Markt- und Netzinteressen zu gewährleisten. In einem Ampelmodell (siehe Hinweise vom FNN zum Netzbetrieb mit Flexibilitäten) kann die Hüllkurve als Netzbetreiber-Instrument für die grüne und gelbe Ampelphase eingeordnet werden. Als übergeordnetes Ziel aus VNB Perspektive steht die effizientere Auslastung der Infrastruktur und die kostengünstige Integration von steuerbaren Anlagen ("Energiewendeanlagen") in die Niederspannungsnetze. Das generische Flexbandkonzept ermöglicht dabei eine Vielzahl von energiewirtschaftlichen Anwendungsmöglichkeiten. Bei unterschielichen Akteuren (bspw. Netzbetreiber und Lieferant), bildet der MSB ein kosolidiertes Profil. Analog zum Ad-hoc Residualprofil, wird hier das sogenannte "POEN-Residualprofil gebildet. Weitere Details zur Verwendung und Einordnung finden sich in den folgenden Veröffentlichungen: 

    - https://www.ppc-ag.de/de/blog/vorausschauen-statt-nachbessern-steuerung-nach-huellkurve/

    - https://www.vde.com/de/fnn/aktuelles/impuls-flexband 


    Ingesamt ergeben sich die folgenden API Dienste die mit der entsprechenden Berechtigung beim MSB bestellt und genutzt werden können:
      -  Flex-01 - "Übermittlung dynamisches Flexband" Vorgabe der verbrauchsseitigen (POEN Szenario 1) oder der einspeiseseitigen Hüllkurve (POEN Szenario 2).  Es können je nach Berechtigung maximale und minimale Leistungslimits für die nächsten 48 Stunden definiert werden. Der MSB bildet auf der Basis ein POEN-Residualprofil (POEN-RP) und sorgt damit für eine konfliktfreie Übertragung des Flexbandes. 

      -  Flex-02 - TBD: "Übermittlung statisches Flexband"  Vorgabe eines zyklischen, sich täglich wiederholenden Flexbandes. Sofern die Steuerungseinrichtung den statischen Anwendungsfall unterstützt, kann das Profil lokal hinterlegt und autonom ausgeführt werden. Andernfalls sorgt der MSB dafür, dass Flex-01 und Flex-02 zu einem gemeinsamen POEN-Residualprofil verarbeitet und regelmäßig übermittelt werden.

      - Flex-03 - "Übermittlung Fallback" - Vorgabe einer Fallbackkurve (POEN Szenario 3). Es können maximale und minimale Leistungslimits für beide Energierichtungen definiert werden. Die Vorgaben haben einen zeitlichen Bezug (0-24h), aber keine Datumsangabe. Die Fallbackwerte werden temporär bei lokalen Kommunikationsstörungen oder Lücken im POEN-Residualprofil aktiviert. Der MSB sorgt für ein konsolidiertes Fallbackprofil, dieses entspricht dem Steuerungsanwendungsfällen 9 gemäß Implementierungshinweis des BSI (SAF9)

      - Flex-04 - "Löschen von Hülllkurven" - Erlaubt die Löschung von zuvor übermittelten Hüllkurven. Die ausgewählten Profile des jeweiligen Absenders werden gelöscht und das POEN-Residualprofil aktualisiert.





 
  
servers:
  - url: https://api.example.com

tags:
  - name: Anweisung Flexband
    description: MSB = API-Anbieter (Server)
  - name: Antwort Flexband
    description: MSB = API-Nutzer (Client)
  - name: Mitteilung Flexband an Berechtigte
    description: MSB = API-Nutzer (Client)
  

paths:

  /to/msb/flexband/command/poen-dynamic-profile/v0:
    post:
      tags: [Anweisung Flexband]
      summary: Flex-01 -> Übermittlung dynamisches Flexband
      description: >
        Vorgabe der verbrauchsseitigen (POEN Szenario 1) oder der einspeiseseitigen Hüllkurve (POEN Szenario 2).  Es können je nach Berechtigung maximale und minimale Leistungslimits für die nächsten 48 Stunden definiert werden. Der MSB bildet auf der Basis ein POEN-Residualprofil (POEN-RP) und sorgt damit für eine konfliktfreie Übertragung des Flexbandes. Die POEN Residualprofile (POEN RP S1 und POEN RP S2) entsprechen dabei den Steuerungsanwendungsfällen 7 und 8 gemäß Implementierungshinweis des BSI (SAF7 / SAF8).


        **Mögliche energiewirtschaftliche Szenarien:**
         - VNB - §14a EnWG „präventiv” (Bis Ende 2028) -> POEN RP S1
         - 	VNB - Redispatch (2.0/3.0) -> POEN RP S2
         - 	VNB - Vorausschauende Steuerung* -> POEN RP S1/S2
         - LF – Direktvermarktung** -> POEN RP S2
         - LF - Vertrags- und Bilanzoptimierung** -> POEN S1/S2
         - LF – Systemdienstleistungen (aFRR / mFRR ** -> POEN S1/S2

        *Vorausschauende, prognosebasierte Steuerung, vgl. FNN Hinweis „Netzbetrieb mit Flexibilitäten“. Umsetzbar bspw. auf vertraglicher Basis (z.B. per FCA - flexibler Netzanschlussvereinbarung (§17 (2b) EnWG))


        **Insbesondere die Option auch Leistung zu aktivieren und gezielt für Einspeisung bzw. Bezug aus dem Netz zu sorgen, kann eine wichtige Option sein, die optimierte Nutzung der Kleinstflexibilitäten über die iMs Infrastruktur zu realisieren. Gesetzlich/Regulatorische Themen stellen einen „Treiber“ für die marktlichen Steuerungsanwendungsfälle dar (u.a. §10b EEG, §34 (2) MsbG und MiSpeL).


      operationId: createFlexband
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FlexbandRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/msb/flexband/command/poen-static-profile/v0:
    post:
      tags: [Anweisung Flexband]
      summary: Flex-02 -> Übermittlung statisches Flexband
      description: >
        Statisches, täglich wiederkehrendes Hüllkurvenprofil. Vorgabe der verbrauchsseitigen (POEN Szenario 1) oder der einspeiseseitigen Hüllkurve (POEN Szenario 2).  Es können je nach Berechtigung maximale und minimale Leistungslimits für 24 Stunden definiert werden. Der MSB bildet zusammen mit den dynamisch übermittelten Hüllkurven geeignete POEN-Residualprofil (POEN-RP) und sorgt damit für eine konfliktfreie Übertragung des Flexbandes.
        Die POEN Residualprofile (POEN RP S1 und POEN RP S2) entsprechen dabei den Steuerungsanwendungsfällen 7 und 8 gemäß Implementierungshinweis des BSI (SAF7 / SAF8).



        **Mögliche energiewirtschaftliche Szenarien:**
         - VNB - §14a EnWG „präventiv” (Bis Ende 2028) -> POEN RP S1
         - VNB – Backup-Fahrplan für Kommunikationsstörung -> POEN RP S1/S2
         - LF – Backup-Fahrplan für Kommunikationsstörung -> POEN RP S1/S2


         **Hinweis:** Es gilt zu diskuttieren ob diese Art der Flexband Ausprägung notwendig ist. Eine Alternative könnte die Anpassung der technischen UseCase Spezifikation (EEBUS) sein, sodass stattdessen die Fallbackkurven für die fachlichen Szenarien eingesetzt werden können. Aktuell defineren diese lediglich das temporäre Verhalten bei lokalem Kommunikationsausfall und sind somit ungeeignet. Eine Anpassung, sodass diese auch dauerhaft gültig sind wenn keine dynamische Hüllkurve aktiviert ist, könnte ein Lösungsweg darstellen. 


      operationId: createStaticFlexband
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FlexbandStaticRequest'
      responses:
        '200':
          description: Erfolgreich verarbeitet
  /to/msb/flexband/parameter/fallback/v0:
    post:
      tags: [Anweisung Flexband]
      summary: Flex-03 -> Konfiguration einer Fallback-Küllkurve
      description: >
        Vorgabe einer Fallbackkurve (POEN Szenario 3). Es können maximale Leistungslimits für die jeweilige  Energierichtungen definiert werden. Die Vorgaben haben einen zeitlichen Bezug (0-24h), aber keine Datumsangabe. Die Fallbackwerte werden temporär bei lokalen Kommunikationsstörungen oder Lücken im POEN-Residualprofil aktiviert. Der MSB sorgt für ein konsolidiertes Fallbackprofil, dieses entspricht dem Steuerungsanwendungsfällen 9 gemäß Implementierungshinweis des BSI (SAF9)
      operationId: createFallback
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FallbackRequest'
      responses:
        '202':
          description: accepted
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '405':
          description: Method not allowed
        '415':
          description: Unsupported Media Type
        '422': 
          description: Unprocessable Entity
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
        '504':
          description: Gateway Timeout

  /to/msb/flexband/reset/v0:
    post:
      tags: [Anweisung Flexband]
      summary: Flex-04 -> Löschen bestehender Hüllkurven
      description: >
        Erlaubt die Deaktivierung/Löschung von zuvor übermittelten Hüllkurven. Es werden alle Einträge des Absenders, die nach dem gewünschten Zeitpunkt liegen, im ausgewählten Profil gelöscht.
      operationId: resetFlexband
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - $ref: '#/components/parameters/creationDateTime'
        - $ref: '#/components/parameters/initialTransactionId'
       # - $ref: '#/components/parameters/controlActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialStateRequest'
      responses:
        '200':
          description: Erfolgreich zurückgesetzt

