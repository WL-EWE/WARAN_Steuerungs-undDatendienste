components:

  parameters:

    transactionId:
      name: transactionId
      in: header
      description: Externe Transaktions-Id zur eindeutigen Identifikation des Aufrufs des sendenden Marktpartners.
      required: true
      schema:
        type: string
        format: uuid
        example: fd85cf16-c24d-41ff-938d-ff45f2273100

    creationDateTime:
      name: creationDateTime
      in: header
      description: Zeitpunkt an dem der Aufruf erstellt wurde
      required: true
      schema:
        type: string
        format: date-time
        example: 2026-07-07T06:58:27.384Z
    referenceId:
          name: referenceId
          in: header
          description: Externe Vorgangsreferenz zur eindeutigen Identifikation des ursprünglichen Befehls (transactionId aus vorlegleagerten Request "Anweisung Flexband").
          required: true
          schema:
            type: string
            format: uuid
            example: de14872e-71e7-407f-916f-da8dbde05178

    initialTransactionId:
      name: initialTransactionId
      in: header
      description: Zur Angabe des Idempotenzschlüssels im Falle eines Retry.
      required: false
      schema:
        type: string
        format: uuid

    controlActor:
      name: marketPartnerId
      in: header
      required: false
      schema:
        type: string
        description: BDEW-ID

  schemas:
    LocationReference:
      type: object
      required:
        - locationId
      properties:
        locationId:
          type: string
          description: Die ID wird durch den BDEW festgelegt. In der vorliegenden Spezifikation wird angenommen, dasss zukünftig ausschließlich über die SR-ID gesteuert wird.
          pattern: '^C[A-Z0-9]{9}[0-9]$'
          example: C1234848431
        subLocationId:
          type: string
          #items:
          #  type: string
          example: "i:98765_u:238bfn2299vfb3"
          description: Ausblick -> Optionale SubLocationId um zukünftig den Steuerbefehl auf einzelne Geräte unterhalb der SR-ID zu beschränken. Im Standard bezieht sich der Befehl auf den Netzanschlusspunkt (adressiert über die SR-ID). Sollen einzelne Geräte (oder Gerätegruppen) speziell Vermarktet und adressiert werden, kann die SubLocationId genutzt werden.  Es könnte bspw. eine spezifische EMS-ID adressiert werden, sodass eine EMS Hierachie abbildbar wäre inkl unterschiedlichewr Zuständikeit (bspw. im MFH).
          

    FlexbandRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenControlStartTime
              - poenControlProfile
              - poenReason
            properties:
              poenContractId:
                type: string
                description: Ausblick -> Optional und gff zielführned, sofern der POEN UseCase überwiegend auf vertraglicher Basiis eingesetzt wird. Die ID könnte zukünftig bis zu HEMS durchgereicht werden und dort zur Validierung und Nachvollziehbarkeit verwendet werden. Es wäre eine Anpassung am technischen UseCase (EEBUS) notwendig  
                example: LF-2026-4711
              poenReason:
                type: string
                enum:
                  - Contract
                  - Test
                example: Contract
              poenControlStartTime:
                type: string
                format: date-time
                example: "2026-01-15T00:00:00Z"
              poenControlProfile:
                type: string
                enum:
                  - Consumption
                  - FeedIn
                example: Consumption

      #        poenRepetitionFlag:
      #          type: boolean
      #          default: false
      #          example: false
              poenControlSlotsMax:
                type: array
                maxItems: 192
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 11000
                  - duration: 900
                    activePowerValue: 9000
                  - duration: 900
                    activePowerValue: 7000
                  - duration: 900
                    activePowerValue: 5000

              poenControlSlotsMin:
                type: array
                maxItems: 192
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 3000
                  - duration: 900
                    activePowerValue: 4000

    FlexbandStaticRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'       
          - type: object

            required:
              - poenControlStartTime
              - poenControlProfile
              - poenReason
              - ExecutionRange

            properties:
              poenContractId:
                type: string
                description: Ausblick -> Optional und gff zielführned, sofern der POEN UseCase überwiegend auf vertraglicher Basiis eingesetzt wird. Die ID könnte zukünftig bis zu HEMS durchgereicht werden und dort zur Validierung und Nachvollziehbarkeit verwendet werden. Es wäre eine Anpassung am technischen UseCase (EEBUS) notwendig  
                example: LF-2026-4711
              poenReason:
                type: string
                enum:
                  - Contract
                  - Test
                example: Contract
              poenControlProfile:
                type: string
                enum:
                  - Consumption
                  - FeedIn
                example: Consumption
              ExecutionRange:
                allOf:
                  - type: object
                    required:
                      - executionFrom
                      - executionUntil
                    properties:
                      executionFrom:
                        type: string
                        format: date-time
                      executionUntil:
                        type: string
                        format: date-time
              poenControlStartTime:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'
                example: "00:00:00Z"
              poenControlSlotsMax:
                type: array
                maxItems: 96
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 11000
                  - duration: 900
                    activePowerValue: 9000
                  - duration: 900
                    activePowerValue: 7000
                  - duration: 900
                    activePowerValue: 5000
              poenControlSlotsMin:
                type: array
                maxItems: 96
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 3000
                  - duration: 900
                    activePowerValue: 4000

    FallbackRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenConfigProfile
              - poenConfigSlots
            properties:
              poenContractId:
                type: string
                description: Ausblick -> Optional und gff zielführned, sofern der POEN UseCase überwiegend auf vertraglicher Basiis eingesetzt wird. Die ID könnte zukünftig bis zu HEMS durchgereicht werden und dort zur Validierung und Nachvollziehbarkeit verwendet werden. Es wäre eine Anpassung am technischen UseCase (EEBUS) notwendig  
                example: LF-2026-4711

              poenConfigProfile:
                type: string
                enum:
                  - Fallback_FeedIn
                  - Fallback_Consumption
                example: Fallback_Consumption

              poenConfigSlots:
                type: array
                description: Startzeitpunkt für Fallback-Profile ist immer 00:00:00Z
                maxItems: 96
                items:
                  $ref: '#/components/schemas/FallbackSlot'
                example:
                  - duration: 27000
                    activePowerValue: 8000
                  - duration: 1800
                    activePowerValue: 7500
                  - duration: 1800
                    activePowerValue: 7000
                  - duration: 2700
                    activePowerValue: 6500

    InitialStateRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenStopTime
            properties:
              poenStopTime:
                type: string
                format: date-time
              stopProfile:
                type: string
                example: "Flex-01"
                enum:
                  - Flex-01
                  - Flex-02
                  - Flex-03
                  - All
    PreliminaryResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - preliminaryState
              - preliminaryResponseCode
            properties:
              preliminaryState:
                type: string
                enum: [possible, unable]
                example: "unable"
              preliminaryResponseCode:
                type: string
                enum: [succeeded, communicationFailure, overload, maintanance, missing contract, invalid message, unable]
                description: >
                  succeeded = erfolgreiche Verarbeitung; 
                  communicationFailure = temporäre Störung in der Gerätekommunikation; 
                  localFailure = Gerät(e) Störung - wird durch Außendienst behoben;
                  customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (bspw. SHIP Pairing);
                  overload = Überlastung der Kommunikationsstrecke;
                  missing contract = Keine gültige Berechtigung;
                  invalid message = Nachricht enthält fachliche Fehler;
                  unable = Sonstiger Fehler, siehe weitere Fehlerbeschreibung.
                example: "customerInteractionRequired"
              preliminaryReason:
                type: string
                example: "Fehlendes Pairing zwischen der Steuerungseinrichtung und der steuerbaren Einrichtung des Betreibers. Eine Kundeninteraktion ist notwendig"

    FinalResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - state
              - responseCode
            properties:
              state:
                type: string
                enum: [possible, unable]
              responseCode:
                type: string
                enum: [succeeded, communicationFailure, overload, maintanance, missing contract, invalid message, unable]
                description: >
                  succeeded = erfolgreiche Verarbeitung; 
                  communicationFailure = temporäre Störung in der Gerätekommunikation; 
                  localFailure = Gerät(e) Störung - wird durch Außendienst behoben;
                  customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (bspw. SHIP Pairing);
                  overload = Überlastung der Kommunikationsstrecke;
                  missing contract = Keine gültige Berechtigung;
                  invalid message = Nachricht enthält fachliche Fehler;
                  unable = Sonstiger Fehler, siehe weitere Fehlerbeschreibung.
              reason:
                type: string
                description: Freitext zur weiteren Fehlerbeschreibung
            
            example:
                locationId: C1234848431
                state: possible
                responseCode: succeeded 
                reason: Flexband bzw. POEN-Residualprofil erfolgreich in der Steuerungseinrichtung aktiviet.
      

    InformationRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - partnerId
            properties:
              partnerId:
                type: string
                example: 9900496000005
              dynamicFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FlexbandRequest'
              staticFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FlexbandStaticRequest'
              fallbackFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FallbackRequest'
              resetFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/InitialStateRequest'

    ControlSlot:
      type: object
      required:
        - duration
        - activePowerValue
      properties:
        duration:
          type: integer
          description: Dauer in Sekunden
          minimum: 900
          maximum: 86400
        activePowerValue:
          type: integer
          description: Wirkleistung in kW
          minimum: 0

    FallbackSlot:
      type: object
      required:
        - duration
        - activePowerValue
      properties:
        duration:
          type: integer
          description: Dauer in Sekunden
          minimum: 900
          maximum: 86400
        activePowerValue:
          type: integer
          description: Wirkleistung in kW
          minimum: 0
