components:

  parameters:

    transactionId:
      name: transactionId
      in: header
      required: true
      schema:
        type: string
        format: uuid

    creationDateTime:
      name: creationDateTime
      in: header
      required: true
      schema:
        type: string
        format: date-time

    initialTransactionId:
      name: initialTransactionId
      in: header
      required: false
      schema:
        type: string
        format: uuid

    controlActor:
      name: marketPartnerId
      in: header
      required: false
      schema:
        type: string
        description: BDEW-ID

  schemas:
    LocationReference:
      type: object
      required:
        - srId
      properties:
        srId:
          type: string
          pattern: '^C[A-Z0-9]{9}[0-9]$'
          example: C1234848431

    FlexbandRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenControlStartTime
              - poenControlProfile
              - poenReason
            properties:
              poenContractId:
                type: string
                example: LF-2026-4711
              poenReason:
                type: string
                enum:
                  - Contract
                  - Test
                example: Contract
              poenControlStartTime:
                type: string
                format: date-time
                example: "2026-01-15T00:00:00Z"
              poenControlProfile:
                type: string
                enum:
                  - Consumption
                  - FeedIn
                example: Consumption

      #        poenRepetitionFlag:
      #          type: boolean
      #          default: false
      #          example: false
              poenControlSlotsMax:
                type: array
                maxItems: 192
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 11000
                  - duration: 900
                    activePowerValue: 9000
                  - duration: 900
                    activePowerValue: 7000
                  - duration: 900
                    activePowerValue: 5000

              poenControlSlotsMin:
                type: array
                maxItems: 192
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 3000
                  - duration: 900
                    activePowerValue: 4000

    FlexbandStaticRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'       
          - type: object

            required:
              - poenControlStartTime
              - poenControlProfile
              - poenReason
              - ExecutionRange

            properties:
              poenContractId:
                type: string
                example: LF-2026-4711
              poenReason:
                type: string
                enum:
                  - Contract
                  - Test
                example: Contract
              poenControlProfile:
                type: string
                enum:
                  - Consumption
                  - FeedIn
                example: Consumption
              ExecutionRange:
                allOf:
                  - type: object
                    required:
                      - executionFrom
                      - executionUntil
                    properties:
                      executionFrom:
                        type: string
                        format: date-time
                      executionUntil:
                        type: string
                        format: date-time
              poenControlStartTime:
                type: string
                pattern: '^([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ$'
                example: "00:00:00Z"
              poenControlSlotsMax:
                type: array
                maxItems: 96
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 11000
                  - duration: 900
                    activePowerValue: 9000
                  - duration: 900
                    activePowerValue: 7000
                  - duration: 900
                    activePowerValue: 5000
              poenControlSlotsMin:
                type: array
                maxItems: 96
                items:
                  $ref: '#/components/schemas/ControlSlot'
                example:
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 2000
                  - duration: 900
                    activePowerValue: 3000
                  - duration: 900
                    activePowerValue: 4000

    FallbackRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenConfigProfile
              - poenConfigSlots
            properties:
              poenContractId:
                type: string
                example: LF-2026-4711

              poenConfigProfile:
                type: string
                enum:
                  - Fallback_FeedIn
                  - Fallback_Consumption
                example: Fallback_Consumption

              poenConfigSlots:
                type: array
                description: Startzeitpunkt für Fallback-Profile ist immer 00:00:00Z
                maxItems: 96
                items:
                  $ref: '#/components/schemas/FallbackSlot'
                example:
                  - duration: 900
                    activepowerValue: 8000
                  - duration: 900
                    activepowerValue: 7500
                  - duration: 900
                    activepowerValue: 7000
                  - duration: 900
                    activepowerValue: 6500

    InitialStateRequest:
        allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - poenStopTime
            properties:
              poenStopTime:
                type: string
                format: date-time
              stopProfile:
                type: string
                example: "Flex-01"
                enum:
                  - Flex-01
                  - Flex-02
                  - Flex-03
                  - All
    PreliminaryResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - preliminaryState
              - preliminaryResponseCode
            properties:
              preliminaryState:
                type: string
                enum: [possible, unable]
                example: "unable"
              preliminaryResponseCode:
                type: string
                enum: [succeeded, communicationFailure, overload, maintanance, missing contract, invalid message, unable]
                description: >
                  succeeded = erfolgreiche Verarbeitung; 
                  communicationFailure = temporäre Störung in der Gerätekommunikation; 
                  localFailure = Gerät(e) Störung - wird durch Außendienst behoben;
                  customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (bspw. SHIP Pairing);
                  overload = Überlastung der Kommunikationsstrecke;
                  missing contract = Keine gültige Berechtigung;
                  invalid message = Nachricht enthält fachliche Fehler;
                  unable = Sonstiger Fehler, siehe weitere Fehlerbeschreibung.
                example: "customerInteractionRequired"
              preliminaryReason:
                type: string
                example: "Fehlendes Pairing zwischen der Steuerungseinrichtung und der steuerbaren Einrichtung des Betreibers. Eine Kundeninteraktion ist notwendig"

    FinalResponse:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - state
              - responseCode
            properties:

              poenContractId:
                type: string
              state:
                type: string
                enum: [possible, unable]
              responseCode:
                type: string
                enum: [succeeded, communicationFailure, overload, maintanance, missing contract, invalid message, unable]
                description: >
                  succeeded = erfolgreiche Verarbeitung; 
                  communicationFailure = temporäre Störung in der Gerätekommunikation; 
                  localFailure = Gerät(e) Störung - wird durch Außendienst behoben;
                  customerInteractionRequired = Mitwirkung durch den Betreiber notwendig (bspw. SHIP Pairing);
                  overload = Überlastung der Kommunikationsstrecke;
                  missing contract = Keine gültige Berechtigung;
                  invalid message = Nachricht enthält fachliche Fehler;
                  unable = Sonstiger Fehler, siehe weitere Fehlerbeschreibung.
              reason:
                type: string
                description: Freitext zur weiteren Fehlerbeschreibung
            
            example:
                srId: C1234848431
                state: possible
                responseCode: succeeded 
                reason: Flexband bzw. POEN-Residualprofil erfolgreich in der Steuerungseinrichtung aktiviet.
      

    InformationRequest:
      allOf:
          - $ref: '#/components/schemas/LocationReference'  
          - type: object
            required:
              - partnerId
            properties:
              partnerId:
                type: string
                example: 9900496000005
              dynamicFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FlexbandRequest'
              staticFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FlexbandStaticRequest'
              fallbackFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/FallbackRequest'
              resetFlexband:
                type: array
                items:
                  $ref: '#/components/schemas/InitialStateRequest'

    ControlSlot:
      type: object
      required:
        - duration
        - activePowerValue
      properties:
        duration:
          type: integer
          description: Dauer in Sekunden
          minimum: 900
          maximum: 86400
        activePowerValue:
          type: integer
          description: Wirkleistung in kW
          minimum: 0

    FallbackSlot:
      type: object
      required:
        - duration
        - powerValue
      properties:
        duration:
          type: integer
          description: Dauer in Sekunden
          minimum: 900
          maximum: 86400
        activePowerValue:
          type: integer
          description: Wirkleistung in kW
          minimum: 0
