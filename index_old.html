<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WARAN API Dokumentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">

    <style>
        .logo-container {
            position: fixed;
            top: 10px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .logo-waran {
            max-height: 60px;
            max-width: auto;
        }
        
        .logo-bmwe {
            max-height: 180px;
            max-width: auto;
        }

        body {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="waran.png" alt="WARAN Logo" class="logo-waran">
        <img src="bmwe.svg" alt="BMWE Logo" class="logo-bmwe">
    </div>

    <h2>API-Auswahl</h2>

    <select id="apiSelect">
        <option value="adhocapi.yaml">AdHoc API</option>
        <option value="flexband.yaml">Flexband API</option>
        <option value="status.yaml">SR Status API</option>
    </select>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script>
        let ui = SwaggerUIBundle({
            url: "adhocapi.yaml",
            dom_id: "#swagger-ui"
        });

        document.getElementById("apiSelect").addEventListener("change", function() {
            ui.specActions.updateUrl(this.value);
            ui.specActions.download(this.value);
        });
    </script>

</body>
</html>
